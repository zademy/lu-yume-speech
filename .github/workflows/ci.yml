name: CI

on:
  push:
    branches: [main, develop, releases]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        # Version is read from package.json "packageManager" (pnpm@11.20.0).
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Audit production dependencies
        run: pnpm audit --prod || true

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Build web SPA
        run: pnpm build

      - name: Verify no API key leaked in bundle
        run: |
          if grep -rn 'VITE_GROQ\|gsk_[A-Za-z0-9]\{40\}' dist/; then
            echo "::error::API key or VITE_GROQ reference found in bundle"
            exit 1
          fi
          echo "Bundle clean — no API key leaked"

  release:
    name: Prepare or Create Release
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Update release PR or create GitHub Release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  container:
    name: Build and Publish Container
    needs: [quality, release]
    if: >-
      !cancelled() && needs.quality.result == 'success' &&
      needs.release.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate calendar version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -eo pipefail
          created_at="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.created_at')"
          today="$(printf '%s' "$created_at" | cut -c1-10 | tr '-' '.')"

          # Retry transient GHCR/network errors (curl exit 18, connection reset, etc.)
          with_retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if "$@"; then return 0; fi
              echo "::warning::Transient network failure (attempt ${attempt}/5); retrying in $((attempt * 2))s..."
              sleep "$((attempt * 2))"
            done
            return 1
          }

          # Fetch a GHCR pull token.
          token_response=""
          if ! token_response="$(with_retry curl --fail --silent --show-error \
                --user "${GITHUB_ACTOR}:${GH_TOKEN}" \
                "https://ghcr.io/token?service=ghcr.io&scope=repository:${IMAGE_NAME}:pull")"; then
            echo "::error::Could not fetch GHCR pull token after retries"
            exit 1
          fi
          registry_token="$(printf '%s' "$token_response" | jq -r '.token')"

          # List calendar-versioned tags (with pagination) and find today's highest counter.
          list_today_counters() {
            local url="https://ghcr.io/v2/${IMAGE_NAME}/tags/list?n=100"
            local headers body next_path
            headers="$(mktemp)"; body="$(mktemp)"
            while [ -n "$url" ]; do
              : > "$headers"
              if ! with_retry curl --fail --silent --show-error \
                --dump-header "$headers" \
                --output "$body" \
                --header "Authorization: Bearer ${registry_token}" \
                "$url"; then
                rm -f "$headers" "$body"
                echo "::error::Could not list tags from GHCR"
                return 1
              fi
              jq -r --arg prefix "${today}." \
                '.tags[]? | select(startswith($prefix)) | sub("^" + $prefix; "") | tonumber' \
                "$body"
              next_path="$(tr -d '\r' < "$headers" \
                | grep -i '^link:' | cut -d'<' -f2 | cut -d'>' -f1 || true)"
              if [ -n "$next_path" ]; then
                url="https://ghcr.io${next_path}"
              else
                url=""
              fi
            done
            rm -f "$headers" "$body"
          }

          if ! max_n="$(list_today_counters | sort -n | tail -n 1)"; then
            exit 1
          fi
          if [ -z "$max_n" ]; then max_n=0; fi

          # Pick the first free counter for today (handles parallel-run collisions).
          candidate_n=$((max_n + 1))
          while :; do
            version="${today}.${candidate_n}"
            status="$(
              with_retry curl --silent --show-error \
                --output /dev/null \
                --write-out '%{http_code}' \
                --http1.1 \
                --header "Authorization: Bearer ${registry_token}" \
                --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
                "https://ghcr.io/v2/${IMAGE_NAME}/manifests/${version}"
            )"
            case "$status" in
              404)
                echo "version=${version}" >> "$GITHUB_OUTPUT"
                echo "exists=false" >> "$GITHUB_OUTPUT"
                echo "Generated version ${version}"
                exit 0
                ;;
              200)
                echo "Version ${version} already exists; incrementing counter"
                candidate_n=$((candidate_n + 1))
                if [ "$candidate_n" -gt $((max_n + 20)) ]; then
                  echo "::error::Too many version collisions for ${today}"
                  exit 1
                fi
                ;;
              *)
                echo "::error::GHCR returned HTTP ${status} for ${IMAGE}:${version}"
                exit 1
                ;;
            esac
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=LU YUME
            org.opencontainers.image.description=Browser speech-to-text SPA powered by Groq Whisper
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push image
        id: build
        if: steps.version.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  promote-latest:
    name: Promote Latest Container
    needs: container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-latest-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote newest calendar version to latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        run: |
          registry_token="$(
            curl --fail --silent --show-error \
              --user "${GITHUB_ACTOR}:${GH_TOKEN}" \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${IMAGE_NAME}:pull" \
              | jq -r '.token'
          )"

          newest_version() {
            local url="https://ghcr.io/v2/${IMAGE_NAME}/tags/list?n=100"
            local headers body next_path tags
            headers="$(mktemp)"
            body="$(mktemp)"
            tags="$(mktemp)"

            while [ -n "$url" ]; do
              : > "$headers"
              if ! curl --fail --silent --show-error \
                --dump-header "$headers" \
                --output "$body" \
                --header "Authorization: Bearer ${registry_token}" \
                "$url"; then
                rm -f "$headers" "$body" "$tags"
                return 1
              fi
              if ! jq -r '.tags[]? | select(test("^[0-9]{4}[.][0-9]{2}[.][0-9]{2}[.][0-9]+$"))' \
                "$body" >> "$tags"; then
                rm -f "$headers" "$body" "$tags"
                return 1
              fi

              next_path="$(
                tr -d '\r' < "$headers" \
                  | grep -i '^link:' \
                  | cut -d'<' -f2 \
                  | cut -d'>' -f1 \
                  || true
              )"
              if [ -n "$next_path" ]; then
                url="https://ghcr.io${next_path}"
              else
                url=""
              fi
            done

            latest_version="$(sort -V "$tags" | tail -n 1)"
            rm -f "$headers" "$body" "$tags"
            printf '%s\n' "$latest_version"
          }

          for attempt in 1 2 3 4 5; do
            if ! version="$(newest_version)"; then
              echo "::error::Could not list all calendar-versioned images"
              exit 1
            fi
            if [ -z "$version" ]; then
              echo "::error::No calendar-versioned image was found"
              exit 1
            fi

            docker buildx imagetools create \
              --tag "$TARGET_IMAGE" \
              "${REGISTRY}/${IMAGE_NAME}:${version}"

            if ! newest_after="$(newest_version)"; then
              echo "::error::Could not verify the newest calendar version after promotion"
              exit 1
            fi
            if [ "$version" = "$newest_after" ]; then
              echo "Promoted ${version} to latest"
              exit 0
            fi

            echo "A newer version appeared during promotion; retrying (${attempt}/5)"
          done

          echo "::error::Could not converge latest on the newest calendar version"
          exit 1
