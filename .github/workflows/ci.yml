name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  quality:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Audit production dependencies
        run: pnpm audit --prod || true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Build web SPA
        run: pnpm build

      - name: Verify no API key leaked in bundle
        run: |
          if grep -rn 'VITE_GROQ\|gsk_[A-Za-z0-9]\{40\}' dist/; then
            echo "::error::API key or VITE_GROQ reference found in bundle"
            exit 1
          fi
          echo "Bundle clean — no API key leaked"
